name: Apply TLCC desktop topic popup dev patch

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/apply-topic-popup-dev.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-topic-popup.py
      - name: Commit patch
        run: |
          git config user.name 'Maghuro'
          git config user.email '1546139+maghuro@users.noreply.github.com'
          git rm .github/workflows/apply-topic-popup-dev.yml .github/scripts/apply-topic-popup.py
          git add thelounge-clean-chat.css README.md CHANGELOG.md
          git commit -m 'Add desktop full-topic popup for v0.4.5 dev'
          git push origin dev
