name: Fix TLCC v0.4.3 selector chaining

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/tlcc-v0.4.3-chain-fix.yml

permissions:
  contents: write

jobs:
  fix-chaining:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fix same-element pseudo-class chaining
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('thelounge-clean-chat.css')
          s = p.read_text()
          marker = '/* ============================================================\n   19. BLUTOPIA BON GIVEAWAY MESSAGES\n'
          idx = s.find(marker)
          if idx == -1:
              raise SystemExit('Section 19 marker not found')

          head = s[:idx]
          tail = s[idx:]
          # A newline before :not/:has/:is creates a descendant combinator.
          # In section 19 these lines continue the same .msg compound selector,
          # so remove only that inter-line whitespace.
          fixed = re.sub(r'\n[ \t]*(?=:(?:not|has|is)\()', '', tail)

          if fixed == tail:
              raise SystemExit('No selector-chain whitespace found to fix')
          if re.search(r'\n[ \t]*:(?:not|has|is)\(', fixed):
              raise SystemExit('A chained pseudo-class still begins after whitespace')

          out = head + fixed
          if out.count('{') != out.count('}'):
              raise SystemExit('CSS brace count mismatch')

          p.write_text(out)
          print('OK: section 19 pseudo-class chains are contiguous')
          PY

      - name: Validate
        run: |
          git diff --check -- thelounge-clean-chat.css
          grep -nE 'THE LOUNGE CLEAN CHAT v|--tlcc-version' thelounge-clean-chat.css
          grep -n 'WEB ·' thelounge-clean-chat.css | sed -n '1,20p'

      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "Maghuro"
          git config user.email "1546139+maghuro@users.noreply.github.com"
          git rm .github/workflows/tlcc-v0.4.3-chain-fix.yml
          git add thelounge-clean-chat.css
          git commit -m "Fix v0.4.3 selector chaining"
          git push origin dev
