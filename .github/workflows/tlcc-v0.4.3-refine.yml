name: Apply TLCC v0.4.3 refinement

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/tlcc-v0.4.3-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply v0.4.3 classifier hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          CSS_SECTION = dedent(r'''
          /* ============================================================
             19. BLUTOPIA BON GIVEAWAY MESSAGES
             ============================================================

             The giveaway userscript runs on the DarkPeers website. The DP
             bridge then relays the resulting website chat text into IRC.
             Original BBCode colours do not survive, but The Lounge renders
             emoji as structured .emoji spans that CSS can still inspect.

             Confidence model:
               - REQUEST / BON POOL are structural link-based classifications
                 handled earlier in this file. They take precedence.
               - Emoji-derived classifications remain heuristics. Their badges
                 deliberately retain "WEB ·" and use a dashed border so the UI
                 does not pretend CSS has proved more than it actually has.

             Signatures verified against Blutopia BON Giveaway v6.2.2:
               Giveaway:       🎁 ... ✨ ... ✨
               Sponsor digest: one ✨, without 🎁
               Entries:        📋
               Time:           ⏳
               Final sponsors: 🥳 immediately before tie/result sequence
               Winners:        🏆 (ambiguous: final single result or !top)
               Result:         🏆 + podium/medal emoji (multi-winner result)
               Tie:            ⚠️ immediately before a 🏆 message
               Rigged:         😈, plus trailing 😉 on a full giveaway reminder
               Unrigged:       😒
               Naughty add:    👮
               Rejection:      🚫 / 🛑 / 🚨

             Text-only responses remain impossible to classify reliably after
             the website -> IRC bridge has flattened their markup.
             ============================================================ */


          /* MAIN GIVEAWAY ANNOUNCEMENT / REMINDER - 🎁 ... ✨ ... ✨ */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label="Emoji: wrapped gift"] ~ .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"]) {
              background:
                  color-mix(in srgb, var(--tlcc-gold) 10%, transparent);
              box-shadow:
                  inset 4px 0 0 var(--tlcc-gold),
                  inset 0 1px 0 color-mix(in srgb, var(--tlcc-gold) 30%, transparent),
                  inset 0 -1px 0 color-mix(in srgb, var(--tlcc-gold) 30%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label="Emoji: wrapped gift"] ~ .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"])
          .from .user::after {
              content: "WEB · GIVEAWAY";
              color: var(--tlcc-gold);
              border-color:
                  color-mix(in srgb, var(--tlcc-gold) 60%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-gold) 12%, transparent);
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label="Emoji: wrapped gift"] ~ .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"])
          .content .emoji[aria-label="Emoji: wrapped gift"] {
              font-size: 1.12em;
          }


          /* SPONSOR UPDATE - one ✨, without 🎁
             This remains a coloured WEB message rather than a semantic badge. */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :not(:has(.content .emoji[aria-label="Emoji: wrapped gift"]))
          :has(.content .emoji[aria-label="Emoji: sparkles"])
          :not(:has(.content .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"])) {
              background:
                  color-mix(in srgb, var(--tlcc-gold) 5%, transparent);
              box-shadow:
                  inset 2px 0 0 color-mix(in srgb, var(--tlcc-gold) 70%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(:has(.content .emoji[aria-label="Emoji: wrapped gift"]))
          :has(.content .emoji[aria-label="Emoji: sparkles"])
          :not(:has(.content .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"]))
          .from .user::after {
              color: var(--tlcc-gold);
              border-color:
                  color-mix(in srgb, var(--tlcc-gold) 45%, transparent);
              background:
                  color-mix(in srgb, var(--tlcc-gold) 8%, transparent);
          }


          /* ENTRIES LIST - 📋 */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="clipboard" i]) {
              background:
                  color-mix(in srgb, var(--tlcc-cyan) 5%, transparent);
              box-shadow:
                  inset 2px 0 0 color-mix(in srgb, var(--tlcc-cyan) 72%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="clipboard" i])
          .from .user::after {
              content: "WEB · ENTRIES";
              color: var(--tlcc-cyan);
              border-color:
                  color-mix(in srgb, var(--tlcc-cyan) 50%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-cyan) 9%, transparent);
          }


          /* GIVEAWAY TIME - ⏳ */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="hourglass" i]) {
              background:
                  color-mix(in srgb, var(--tlcc-green) 5%, transparent);
              box-shadow:
                  inset 2px 0 0 color-mix(in srgb, var(--tlcc-green) 72%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="hourglass" i])
          .from .user::after {
              content: "WEB · TIME";
              color: var(--tlcc-green);
              border-color:
                  color-mix(in srgb, var(--tlcc-green) 50%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-green) 9%, transparent);
          }


          /* FINAL SPONSOR THANK-YOU - 🥳
             The userscript emits this immediately before either a tie line or
             the final trophy-bearing winner output. Keep the existing forward
             adjacency requirement to avoid ordinary party emoji. */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="partying" i])
          :is(
              :has(+ .msg[data-type="message"][data-from="DP" i] .content .emoji[aria-label*="warning" i]),
              :has(+ .msg[data-type="message"][data-from="DP" i] .content .emoji[aria-label*="trophy" i])
          ) {
              background:
                  color-mix(in srgb, var(--tlcc-green) 7%, transparent);
              box-shadow:
                  inset 3px 0 0 color-mix(in srgb, var(--tlcc-green) 85%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="partying" i])
          :is(
              :has(+ .msg[data-type="message"][data-from="DP" i] .content .emoji[aria-label*="warning" i]),
              :has(+ .msg[data-type="message"][data-from="DP" i] .content .emoji[aria-label*="trophy" i])
          )
          .from .user::after {
              content: "WEB · SPONSORS";
              color: var(--tlcc-green);
              border-color:
                  color-mix(in srgb, var(--tlcc-green) 55%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-green) 10%, transparent);
          }


          /* TROPHY OUTPUT - 🏆
             v6.2.2 uses the same trophy for both !top and the final winner
             summary. A trophy alone therefore cannot honestly prove RESULT. */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="trophy" i]) {
              background:
                  color-mix(in srgb, var(--tlcc-gold) 12%, transparent);
              box-shadow:
                  inset 4px 0 0 var(--tlcc-gold),
                  inset 0 0 0 1px color-mix(in srgb, var(--tlcc-gold) 28%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="trophy" i])
          .from .user::after {
              content: "WEB · WINNERS";
              color: var(--tlcc-gold);
              border-color:
                  color-mix(in srgb, var(--tlcc-gold) 65%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-gold) 14%, transparent);
          }


          /* HIGH-CONFIDENCE MULTI-WINNER RESULT - 🏆 + medal/podium emoji */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="trophy" i])
          :has(.content .emoji[aria-label*="medal" i])
          .from .user::after {
              content: "WEB · RESULT";
          }


          /* TIE / WARNING - ⚠️
             v6.2.2 emits a tie line immediately before the trophy result.
             Prefer a missed decoration over classifying arbitrary warnings. */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="warning" i])
          :has(+ .msg[data-type="message"][data-from="DP" i] .content .emoji[aria-label*="trophy" i]) {
              background:
                  color-mix(in srgb, var(--tlcc-warning) 8%, transparent);
              box-shadow:
                  inset 3px 0 0 var(--tlcc-warning);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="warning" i])
          :has(+ .msg[data-type="message"][data-from="DP" i] .content .emoji[aria-label*="trophy" i])
          .from .user::after {
              content: "WEB · TIE";
              color: var(--tlcc-warning);
              border-color:
                  color-mix(in srgb, var(--tlcc-warning) 58%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-warning) 11%, transparent);
          }


          /* RIGGED MODE - 😈 / trailing 😉 on full giveaway reminder
             Standalone 😈 is intentionally still heuristic because v6.2.2
             also appends it to rigged entry confirmations. */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="horns" i]),
          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label="Emoji: wrapped gift"] ~ .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"])
          :has(.content .emoji[aria-label*="winking face" i]:last-child) {
              background:
                  color-mix(in srgb, var(--tlcc-rigged) 9%, transparent);
              box-shadow:
                  inset 4px 0 0 var(--tlcc-rigged),
                  inset 0 1px 0 color-mix(in srgb, var(--tlcc-rigged) 28%, transparent),
                  inset 0 -1px 0 color-mix(in srgb, var(--tlcc-rigged) 28%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="horns" i])
          .from .user::after,
          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label="Emoji: wrapped gift"] ~ .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"])
          :has(.content .emoji[aria-label*="winking face" i]:last-child)
          .from .user::after {
              content: "WEB · RIGGED";
              color: var(--tlcc-rigged);
              border-color:
                  color-mix(in srgb, var(--tlcc-rigged) 65%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-rigged) 12%, transparent);
          }


          /* RIGGED MODE DISABLED - 😒 */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="unamused" i]) {
              background:
                  color-mix(in srgb, var(--tlcc-green) 6%, transparent);
              box-shadow:
                  inset 3px 0 0 color-mix(in srgb, var(--tlcc-green) 82%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="unamused" i])
          .from .user::after {
              content: "WEB · UNRIGGED";
              color: var(--tlcc-green);
              border-color:
                  color-mix(in srgb, var(--tlcc-green) 55%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-green) 10%, transparent);
          }


          /* NAUGHTY-LIST ADD - 👮 */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :has(.content .emoji[aria-label*="police officer" i]) {
              background:
                  color-mix(in srgb, var(--tlcc-naughty) 6%, transparent);
              box-shadow:
                  inset 3px 0 0 color-mix(in srgb, var(--tlcc-naughty) 82%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :has(.content .emoji[aria-label*="police officer" i])
          .from .user::after {
              content: "WEB · NAUGHTY";
              color: var(--tlcc-naughty);
              border-color:
                  color-mix(in srgb, var(--tlcc-naughty) 55%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-naughty) 10%, transparent);
          }


          /* REJECTED / UNAUTHORISED - 🚫 / 🛑 / 🚨 */

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :not(.highlight)
          :is(
              :has(.content .emoji[aria-label*="prohibited" i]),
              :has(.content .emoji[aria-label*="stop sign" i]),
              :has(.content .emoji[aria-label*="police car light" i])
          ) {
              background:
                  color-mix(in srgb, var(--tlcc-alert) 7%, transparent);
              box-shadow:
                  inset 3px 0 0 color-mix(in srgb, var(--tlcc-alert) 88%, transparent);
              border-radius: 5px;
          }

          body:has(
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i].active,
              .network > .channel-list-item[data-type="lobby"][data-name="DarkPeers" i]
                  ~ .channels .channel-list-item.active
          ) #chat-container[data-current-channel="#darkpeers" i]
          .msg[data-type="message"][data-from="DP" i]
          :not(:has(.content a:is([href*="darkpeers.org/requests/" i], [href*="darkpeers.org/bon-pool" i])))
          :is(
              :has(.content .emoji[aria-label*="prohibited" i]),
              :has(.content .emoji[aria-label*="stop sign" i]),
              :has(.content .emoji[aria-label*="police car light" i])
          )
          .from .user::after {
              content: "WEB · ALERT";
              color: var(--tlcc-alert);
              border-color:
                  color-mix(in srgb, var(--tlcc-alert) 58%, transparent);
              border-style: dashed;
              background:
                  color-mix(in srgb, var(--tlcc-alert) 10%, transparent);
          }
          ''').lstrip()

          README_GIVEAWAY = dedent(r'''
          ## Giveaway-aware styling

          The **Blutopia BON Giveaway** userscript runs on the DarkPeers website. Its output is then relayed into IRC by the `DP` bridge, so TLCC never sees the userscript state itself — it only sees whatever structure survives that website → IRC → The Lounge path.

          A direct review of Blutopia BON Giveaway v6.2.2 confirmed which emoji signatures are actually emitted by the script. v0.4.3 uses that information to make the CSS heuristics more conservative.

          TLCC now distinguishes two confidence levels:

          - **Structural classifications** such as `REQUEST` and `BON POOL` are based on real surviving DarkPeers links. They keep their normal solid badge treatment and take precedence over emoji heuristics.
          - **Emoji-derived classifications** are still guesses based on surviving `.emoji` spans. Their badge deliberately keeps the `WEB ·` origin and uses a dashed border, making the heuristic nature visible instead of presenting the label as proven semantics.

          Current giveaway treatments include:

          - `WEB · GIVEAWAY` — main announcement/reminder only when the script's full `🎁 ... ✨ ... ✨` sequence survives.
          - Gold `WEB` treatment — sponsor digest with a single `✨` and no `🎁`; this intentionally remains a generic WEB badge rather than claiming a semantic category.
          - `WEB · ENTRIES` — current entries list (`📋`).
          - `WEB · TIME` — remaining-time response (`⏳`).
          - `WEB · SPONSORS` — final sponsor thank-you (`🥳`) only when it is immediately followed by the tie/result sequence.
          - `WEB · WINNERS` — trophy-bearing output (`🏆`) where CSS cannot honestly distinguish a final single-winner result from the userscript's `!top` leaderboard.
          - `WEB · RESULT` — higher-confidence multi-winner final result when both `🏆` and a podium/medal emoji survive.
          - `WEB · TIE` — `⚠️` only when the immediately following `DP` message contains the trophy output expected by the userscript's end sequence.
          - `WEB · RIGGED` — `😈` rigged-mode/rigged-entry output, plus a full giveaway reminder whose userscript-added `😉` is the trailing emoji after the normal `🎁 ... ✨ ... ✨` signature.
          - `WEB · UNRIGGED` — successful rigged-mode disable response (`😒`).
          - `WEB · NAUGHTY` — naughty-list **add** response (`👮`).
          - `WEB · ALERT` — rejected/unauthorised responses marked with `🚫`, `🛑` or `🚨`.

          Emoji rules explicitly exclude messages already carrying the structural `/requests/` or `/bon-pool` hooks, so the stronger link-derived classification wins if signals collide.

          The giveaway palette is centralised in `--tlcc-*` custom properties so it remains easy to maintain without changing the selector logic.

          ''').lstrip()

          README_LIMITS = dedent(r'''
          Giveaway detection has the same constraint: TLCC does not run on the DarkPeers website and cannot inspect the userscript's JavaScript state. It only sees the IRC message produced after the bridge has flattened the website output. Text-only responses such as `Giveaway Amount`, normal entry confirmations (`has entered with the number ...`), `your number is`, winner-scaling messages and time adjustments therefore cannot be identified safely unless they also carry distinctive surviving structure.

          The v0.4.3 review of Blutopia BON Giveaway v6.2.2 also exposed one unavoidable ambiguity: the script uses `🏆` both for its `!top` leaderboard and for the final winner summary. A trophy alone is therefore labelled `WEB · WINNERS`; `WEB · RESULT` is reserved for multi-winner result messages where a podium/medal emoji survives as an additional signal.

          Emoji-based classifications remain intentionally heuristic. The bridge prepends the website username as plain text, so selectors such as `:first-child` on an emoji element do **not** prove that the emoji begins the logical message — text nodes do not participate in element-child pseudo-classes. v0.4.3 therefore prefers stronger emoji combinations/context where the userscript provides them, keeps `WEB ·` visible on heuristic badges, and uses a dashed border to distinguish those guesses from solid link-derived classifications.
          ''').lstrip()

          CHANGELOG_ENTRY = dedent(r'''
          ## v0.4.3 - 2026-09-11

          ### Fixed

          - Audited giveaway detection directly against **Blutopia BON Giveaway v6.2.2**, taking into account that the userscript runs on the DarkPeers website and TLCC only sees the flattened message after the `DP` website → IRC bridge.
          - Tightened the main giveaway/reminder signature from simple `🎁` + `✨` presence to the userscript's actual ordered `🎁 ... ✨ ... ✨` structure.
          - Tightened rigged-reminder detection to require the full giveaway signature plus the userscript-added trailing `😉`.
          - Tightened `TIE` detection: `⚠️` is only classified when the immediately following `DP` message contains the trophy output expected by the userscript's end sequence.
          - Prevented emoji-derived giveaway rules from overriding the stronger link-derived `REQUEST` and `BON POOL` classifications.
          - Removed the misleading assumption that every `🏆` message is necessarily a final result. Blutopia BON Giveaway v6.2.2 also uses `🏆` for its `!top` leaderboard.

          ### Changed

          - Emoji-derived badges now retain their web origin as `WEB · <CATEGORY>` and use a dashed border. Link-derived `REQUEST` and `BON POOL` badges remain solid.
          - Trophy-only messages are now labelled `WEB · WINNERS`, which is true for both the `!top` leaderboard and a final single-winner summary.
          - `WEB · RESULT` is reserved for higher-confidence multi-winner result messages where both `🏆` and a podium/medal emoji survive the bridge.
          - Sponsor digests remain a gold-accented generic `WEB` message rather than receiving a semantic badge.
          - Corrected the `NAUGHTY` documentation: `👮` is emitted by the naughty-list **add** response; removal uses `🥳`.

          ### Reviewed

          - Considered using `:first-child` / positional emoji selectors as an authenticity check, but deliberately rejected that as proof: the bridge prepends `[username]` as a plain text node, and CSS element-child pseudo-classes do not account for text nodes.
          - Reviewed native CSS nesting as a maintainability refactor. It is useful for deduplicating the repeated DarkPeers scope, but it is intentionally deferred to a separate visual-regression-tested refactor because nesting does not reduce selector-matching work by itself.
          - Reviewed the performance concern around repeated `:has()` and forward sibling lookahead. No performance regression is claimed without measurement; the existing unread-marker trade-off remains unchanged pending profiling.

          ### Notes

          - This remains entirely CSS-only. No userscript, bridge, JavaScript or The Lounge source modification is required.
          - The stricter classifier policy intentionally prefers an occasional missed decoration over presenting an uncertain emoji match as authoritative.

          ''').lstrip()

          # ---------- CSS ----------
          p = Path("thelounge-clean-chat.css")
          css = p.read_text()

          if css.count("v0.4.2") != 2:
              raise SystemExit(f"Expected exactly 2 v0.4.2 markers in CSS, found {css.count('v0.4.2')}")

          css = css.replace("v0.4.2", "v0.4.3")

          marker = (
              "/* ============================================================\n"
              "   19. BLUTOPIA BON GIVEAWAY MESSAGES\n"
          )
          idx = css.find(marker)
          if idx == -1:
              raise SystemExit("Section 19 marker not found")

          css = css[:idx].rstrip() + "\n\n\n" + CSS_SECTION.rstrip() + "\n"

          if css.count("{") != css.count("}"):
              raise SystemExit("CSS brace count mismatch")

          p.write_text(css)

          # ---------- README ----------
          p = Path("README.md")
          readme = p.read_text()

          if readme.count("v0.4.2") < 2:
              raise SystemExit("Expected current-version references in README")

          readme = readme.replace("v0.4.2", "v0.4.3")

          start = readme.find("## Giveaway-aware styling\n")
          end = readme.find("## Installation\n", start)
          if start == -1 or end == -1:
              raise SystemExit("README giveaway section bounds not found")
          readme = readme[:start] + README_GIVEAWAY + "\n" + readme[end:]

          old_limits_start = readme.find(
              "Giveaway detection has the same constraint:"
          )
          old_limits_end = readme.find(
              "\n\nThe bot-only `#announce` / `#pre` rules",
              old_limits_start
          )
          if old_limits_start == -1 or old_limits_end == -1:
              raise SystemExit("README giveaway limitation bounds not found")

          readme = (
              readme[:old_limits_start]
              + README_LIMITS.rstrip()
              + readme[old_limits_end:]
          )

          p.write_text(readme)

          # ---------- CHANGELOG ----------
          p = Path("CHANGELOG.md")
          changelog = p.read_text()

          insertion = (
              "All notable changes to **The Lounge Clean Chat** will be documented here.\n\n"
          )
          if insertion not in changelog:
              raise SystemExit("CHANGELOG insertion point not found")
          if "## v0.4.3 - 2026-09-11" in changelog:
              raise SystemExit("v0.4.3 already exists in CHANGELOG")

          changelog = changelog.replace(
              insertion,
              insertion + CHANGELOG_ENTRY,
              1
          )
          p.write_text(changelog)

          # ---------- VALIDATION ----------
          css = Path("thelounge-clean-chat.css").read_text()
          readme = Path("README.md").read_text()
          changelog = Path("CHANGELOG.md").read_text()

          checks = {
              "CSS v0.4.3 header": "THE LOUNGE CLEAN CHAT v0.4.3" in css,
              "CSS version variable": '--tlcc-version: "v0.4.3";' in css,
              "full giveaway signature": 'wrapped gift"] ~ .emoji[aria-label="Emoji: sparkles"] ~ .emoji[aria-label="Emoji: sparkles"]' in css,
              "heuristic origin": 'content: "WEB · GIVEAWAY";' in css,
              "winners ambiguity": 'content: "WEB · WINNERS";' in css,
              "multi result": 'content: "WEB · RESULT";' in css,
              "tie context": ':has(+ .msg[data-type="message"][data-from="DP" i] .content .emoji[aria-label*="trophy" i])' in css,
              "README v0.4.3": "**Current version:** v0.4.3" in readme,
              "CHANGELOG v0.4.3": "## v0.4.3 - 2026-09-11" in changelog,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Validation failed: " + ", ".join(failed))

          print("v0.4.3 refinement applied successfully")
          PY

      - name: Show diff
        run: |
          git diff --check
          git diff --stat
          grep -nE 'THE LOUNGE CLEAN CHAT v|--tlcc-version' thelounge-clean-chat.css
          grep -n 'WEB ·' thelounge-clean-chat.css | head -20

      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "Maghuro"
          git config user.email "1546139+maghuro@users.noreply.github.com"
          git rm .github/workflows/tlcc-v0.4.3-refine.yml
          git add thelounge-clean-chat.css README.md CHANGELOG.md
          git commit -m "Prepare TLCC v0.4.3 classifier hardening"
          git push origin dev
