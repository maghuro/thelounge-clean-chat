name: Promote desktop topic popup without version bump

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/promote-desktop-topic-v044.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Keep production version at v0.4.4
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # CSS + README: keep the tested desktop popup changes, but do not bump version.
          for name in ('thelounge-clean-chat.css', 'README.md'):
              p = Path(name)
              s = p.read_text()
              s = s.replace('v0.4.5-dev.1', 'v0.4.4')
              p.write_text(s)

          # CHANGELOG: fold the dev-only desktop topic notes into v0.4.4.
          p = Path('CHANGELOG.md')
          s = p.read_text()
          start = s.find('## v0.4.5-dev.1 - 2026-09-11\n')
          end = s.find('## v0.4.4 - 2026-09-11\n')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Expected v0.4.5-dev.1 and v0.4.4 sections not found')
          s = s[:start] + s[end:]

          changed_anchor = '### Changed\n\n'
          v044 = s.find('## v0.4.4 - 2026-09-11\n')
          changed = s.find(changed_anchor, v044)
          if changed == -1:
              raise SystemExit('v0.4.4 Changed section not found')
          changed += len(changed_anchor)
          bullets = (
              '- Extended the full formatted channel-topic popup to desktop pointer devices: hovering the topic now reveals the same readable full-topic box already available on touch devices.\n'
              '- Kept the normal compact one-line header unchanged until hover, so the desktop UI does not permanently consume extra vertical space.\n'
              '- The expanded desktop topic includes the local `Enhanced by TLCC vX.X.X` marker, making the loaded TLCC version discoverable on small monitors where the normal topic line truncates before the suffix.\n'
          )
          s = s[:changed] + bullets + s[changed:]

          notes_anchor = '### Notes\n\n'
          notes = s.find(notes_anchor, v044)
          if notes == -1:
              raise SystemExit('v0.4.4 Notes section not found')
          notes += len(notes_anchor)
          note = '- Thanks to **Captain Chungus** for proving that “the marker exists” and “the human can actually see the marker” are two different requirements on a small monitor with a very long topic. 🙃\n'
          s = s[:notes] + note + s[notes:]
          p.write_text(s)
          PY

      - name: Validate version and cleanup helper
        run: |
          grep -q 'THE LOUNGE CLEAN CHAT v0.4.4' thelounge-clean-chat.css
          grep -q -- '--tlcc-version: "v0.4.4";' thelounge-clean-chat.css
          ! grep -R 'v0.4.5-dev.1' thelounge-clean-chat.css README.md CHANGELOG.md
          rm -f .github/workflows/promote-desktop-topic-v044.yml

      - name: Commit promotion-ready dev state
        run: |
          git config user.name 'Maghuro'
          git config user.email '1546139+maghuro@users.noreply.github.com'
          git add thelounge-clean-chat.css README.md CHANGELOG.md .github/workflows/promote-desktop-topic-v044.yml
          git commit -m 'Promote desktop topic popup without version bump'
          git push origin dev
