name: Add v0.4.3 Chungus note

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/tlcc-v0.4.3-chungus-note.yml

permissions:
  contents: write

jobs:
  add-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Add release-note easter egg
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('CHANGELOG.md')
          s = p.read_text()
          needle = '- The stricter classifier policy intentionally prefers an occasional missed decoration over presenting an uncertain emoji match as authoritative.\n'
          note = '- Special mention to **Chungus** and his beautiful **Travis** — not strictly required for CSS classification, but clearly essential to the research methodology. 😏\n'

          if note in s:
              raise SystemExit('Note already present')
          if needle not in s:
              raise SystemExit('v0.4.3 Notes insertion point not found')

          s = s.replace(needle, needle + note, 1)
          p.write_text(s)
          PY

      - name: Commit and remove helper workflow
        run: |
          git config user.name "Maghuro"
          git config user.email "1546139+maghuro@users.noreply.github.com"
          git rm .github/workflows/tlcc-v0.4.3-chungus-note.yml
          git add CHANGELOG.md
          git commit -m "Add v0.4.3 release-note easter egg"
          git push origin dev
