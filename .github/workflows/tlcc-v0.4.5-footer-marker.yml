name: TLCC v0.4.5 footer marker preview

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tlcc-v0.4.5-footer-marker.yml'

permissions:
  contents: write

jobs:
  footer-marker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Add footer version marker and dev version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # CSS
          p = Path('thelounge-clean-chat.css')
          s = p.read_text()
          s = s.replace('THE LOUNGE CLEAN CHAT v0.4.4', 'THE LOUNGE CLEAN CHAT v0.4.5-dev.1', 1)
          s = s.replace('--tlcc-version: "v0.4.4";', '--tlcc-version: "v0.4.5-dev.1";', 1)

          marker = '''\n\n/* ============================================================\n   21. SIDEBAR FOOTER VERSION MARKER\n\n   The topic marker can be truncated on smaller desktop monitors.\n   Mirror the loaded TLCC version in The Lounge's shared sidebar\n   footer so it remains discoverable on desktop and mobile.\n   ============================================================ */\n\n& #footer {\n    flex-wrap: wrap;\n    height: auto;\n    min-height: 45px;\n    padding-bottom: 6px;\n}\n\n& #footer::after {\n    content: "Enhanced by TLCC " var(--tlcc-version);\n    flex: 0 0 100%;\n    width: 100%;\n    min-width: 0;\n    box-sizing: border-box;\n    text-align: center;\n    font-size: 10px;\n    letter-spacing: 0.04em;\n    line-height: 1.2;\n    padding-top: 3px;\n    opacity: 0.45;\n    color: var(--body-color);\n    pointer-events: none;\n    white-space: nowrap;\n}\n'''

          if '21. SIDEBAR FOOTER VERSION MARKER' not in s:
              stripped = s.rstrip()
              if not stripped.endswith('}'):
                  raise SystemExit('Expected outer DarkPeers scope to end with }')
              s = stripped[:-1].rstrip() + marker + '\n}\n'

          if s.count('{') != s.count('}'):
              raise SystemExit(f'CSS brace mismatch: {s.count("{")} opening vs {s.count("}")} closing')
          p.write_text(s)

          # README
          p = Path('README.md')
          r = p.read_text()
          r = r.replace('**Current version:** v0.4.4', '**Current version:** v0.4.5-dev.1', 1)
          r = r.replace('v0.4.4 is explicitly scoped', 'v0.4.5-dev.1 is explicitly scoped', 1)
          r = r.replace('· Enhanced by TLCC v0.4.4', '· Enhanced by TLCC v0.4.5-dev.1', 1)

          anchor = ('This does **not** modify the real IRC topic. It is generated by CSS in the local The Lounge UI and is useful for confirming which TLCC version the browser has actually received. The full formatted topic can be expanded on touch devices and, from v0.4.4, on desktop by hovering the topic — useful on smaller monitors where the normal one-line header can truncate the TLCC marker.\n')
          addition = ('\nIn **v0.4.5-dev.1**, the same version marker is also mirrored onto a second row of The Lounge\'s sidebar footer. The footer is shared by desktop and mobile layouts, so this gives the version a stable home even when the channel topic is too long to show its suffix. On mobile, open the sidebar to see it. The topic marker remains as a secondary confirmation.\n')
          if addition.strip() not in r:
              if anchor not in r:
                  raise SystemExit('README topic-marker insertion point not found')
              r = r.replace(anchor, anchor + addition, 1)
          p.write_text(r)

          # CHANGELOG
          p = Path('CHANGELOG.md')
          c = p.read_text()
          heading = '## v0.4.5-dev.1 - 2026-09-11\n'
          if heading not in c:
              intro = '# Changelog\n\nAll notable changes to **The Lounge Clean Chat** will be documented here.\n\n'
              if not c.startswith(intro):
                  raise SystemExit('CHANGELOG intro not found')
              section = '''## v0.4.5-dev.1 - 2026-09-11\n\n### Changed\n\n- Added a persistent `Enhanced by TLCC vX.X.X` marker to a second row of The Lounge's sidebar footer, so the loaded version is visible even when a long channel topic truncates the existing topic suffix on smaller desktop monitors.\n- Kept the topic marker as a secondary confirmation instead of replacing it.\n- Used the shared `#footer` layout rather than separate desktop/mobile markup; on mobile the marker appears when the sidebar is open.\n\n### Testing\n\n- Development preview only. Verify the footer layout on a normal desktop, a narrow/small desktop window and Android before promoting to `main`.\n- Check that the footer icons keep their normal alignment and that the extra marker row does not overlap or clip the sidebar.\n\n### Notes\n\n- Suggested by **Captain Chungus** after his very long topic required 60% browser zoom to expose the old marker, with an assist from the increasingly employable **T.R.A.V.I.S.** 🙃\n\n'''
              c = intro + section + c[len(intro):]
          p.write_text(c)
          PY

      - name: Validate preview
        run: |
          grep -q 'THE LOUNGE CLEAN CHAT v0.4.5-dev.1' thelounge-clean-chat.css
          grep -q -- '--tlcc-version: "v0.4.5-dev.1";' thelounge-clean-chat.css
          grep -q '21. SIDEBAR FOOTER VERSION MARKER' thelounge-clean-chat.css
          grep -q '& #footer::after' thelounge-clean-chat.css
          grep -q 'Current version:\*\* v0.4.5-dev.1' README.md
          grep -q '## v0.4.5-dev.1 - 2026-09-11' CHANGELOG.md

      - name: Commit preview and remove helper workflow
        run: |
          rm -f .github/workflows/tlcc-v0.4.5-footer-marker.yml
          git config user.name 'Maghuro'
          git config user.email '1546139+maghuro@users.noreply.github.com'
          git add thelounge-clean-chat.css README.md CHANGELOG.md .github/workflows/tlcc-v0.4.5-footer-marker.yml
          git commit -m 'Add sidebar footer version marker preview'
          git push origin dev
